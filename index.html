<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>MIDI Rhythm</title>
<style>
:root { --bg: #0d0f1a; --line: #2a2f4a; --fg: #e8ecff; --mute: #9aa2c8; --tap: #7be0d0; --hold: #f0b45a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body, button, label, select, input { touch-action: manipulation; } /* ダブルタップ拡大を無効にする */
#menu, #result, #pause { touch-action: pan-y; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none;
  font-family: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif; user-select: none; -webkit-user-select: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
[hidden] { display: none !important; }

#menu, #result, #pause { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 14px; -webkit-overflow-scrolling: touch;
  padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: var(--bg); max-width: 520px; margin: 0 auto; overflow-y: auto; }
h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: 0.02em; }
.lead { margin: 0 0 8px; color: var(--mute); }
.file { display: block; padding: 16px; border: 2px solid var(--tap); border-radius: 10px; text-align: center; font-weight: 700; color: var(--tap); cursor: pointer; }
.file.sub { border-color: var(--line); color: var(--mute); }
.file input { display: none; }
.fname { margin: -6px 0 0; font-size: 13px; color: var(--mute); text-align: center; word-break: break-all; }
.opts { display: grid; gap: 14px; margin: 6px 0; }
.opts label { display: grid; gap: 6px; font-size: 14px; color: var(--mute); }
.opts b { color: var(--fg); font-weight: 600; margin-left: 6px; }
label.chk { display: flex; align-items: center; gap: 10px; color: var(--fg); font-size: 15px; }
label.chk input { width: 20px; height: 20px; accent-color: var(--tap); }
select, input[type=range] { width: 100%; }
select { padding: 10px; background: #161a2e; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; font-size: 16px; }
input[type=range] { accent-color: var(--tap); }
button { padding: 16px; font-size: 18px; font-weight: 800; border: 0; border-radius: 10px; background: var(--tap); color: #08201c; cursor: pointer; }
button:disabled { background: var(--line); color: var(--mute); cursor: default; }
.status { margin: 0; min-height: 1.4em; font-size: 13px; color: var(--mute); text-align: center; }
.rlabel { margin: 0; text-align: center; color: var(--mute); }
.rscore { margin: 0; text-align: center; font-size: 56px; font-weight: 800; color: var(--tap); }
.rdetail { white-space: pre-line; margin: 0 0 12px; text-align: center; font-size: 13px; line-height: 1.8; color: var(--mute); }
/* 縦に余白があるときだけ中央寄せにする（はみ出したときに上が切れてスクロールできなくなるのを防ぐ） */
#menu > :first-child, #result > :first-child, #pause > :first-child { margin-top: auto; }
#menu > :last-child, #result > :last-child, #pause > :last-child { margin-bottom: auto; }
#fs, #pbtn { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 8px; z-index: 50; width: 30px; height: 30px; padding: 0; display: grid; place-items: center;
  background: rgba(13, 15, 26, .55); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; opacity: .6; }
#pbtn { right: 46px; }
#fs:active, #pbtn:active { opacity: 1; }
#toast { position: fixed; top: max(48px, calc(env(safe-area-inset-top) + 40px)); left: 50%; transform: translateX(-50%); z-index: 60; max-width: 86%;
  padding: 8px 12px; border-radius: 8px; background: rgba(13, 15, 26, .92); border: 1px solid var(--line); font-size: 12px; line-height: 1.5; text-align: center; }
button:focus-visible, .file:focus-within, select:focus-visible { outline: 3px solid var(--hold); outline-offset: 2px; }
button.sub { background: transparent; color: var(--mute); border: 1px solid var(--line); }

/* 横向き（高さが小さい画面）: 余白と文字を詰め、設定を3列に並べる */
@media (max-height: 520px) {
  #menu, #result, #pause { gap: 8px; padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  #menu { max-width: 860px; }
  h1 { font-size: 22px; }
  .lead { display: none; }
  .opts { grid-template-columns: repeat(3, 1fr); gap: 8px 18px; margin: 0; }
  button { padding: 11px; font-size: 16px; }
  .file { padding: 10px; }
  .rscore { font-size: 36px; }
}

body { position: fixed; inset: 0; width: 100%; height: 100%; } /* ページ自体がずれたりスクロールしたりしないよう固定する */

.cust{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:12px}
.cust .pre{display:flex;gap:6px;flex-wrap:wrap}
.cust .pn{color:var(--mute);font-size:13px;font-weight:400}
.cust button,.keycfg button,.libitem button{padding:8px 12px;font-size:13px;font-weight:700}
#rAdj{padding:12px;font-size:15px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--mute);font-size:14px}
details summary{cursor:pointer;color:var(--fg);font-weight:600}
.libitem{display:flex;gap:8px;align-items:stretch;margin-top:8px}
.libitem .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keycfg{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.keycfg button{min-width:44px}
#rExtra{margin-bottom:8px}

#editor{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-start;gap:10px;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:var(--bg);max-width:none;margin:0;overflow-y:auto;z-index:40;height:100dvh}
#editor h1{font-size:24px}
.edbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.edbar button{padding:8px 10px;font-size:13px;font-weight:700}
.edbar button.on{background:var(--hold);color:#201600}
.edbar select{width:auto;padding:6px 8px;font-size:14px}
#edScroll{flex:1;min-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#10132a}
#edcv{display:block;touch-action:none;margin:0 auto}
#edSel{display:grid;gap:8px}
#edSel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#edSel input,#edSel select{width:auto;padding:6px 8px;font-size:14px;background:#161a2e;color:var(--fg);border:1px solid var(--line);border-radius:8px}
#edSel button{padding:8px 10px;font-size:13px}
#edTimeSlider{width:100%}

</style>
</head>
<body>
<canvas id="cv"></canvas>

<main id="menu">
  <h1>MIDI Rhythm</h1>
  <p class="lead">MIDIファイルを選ぶと、譜面を自動で作ります。</p>
  <label class="file">MIDIファイルを選択<input id="midi" type="file" accept=".mid,.midi,audio/midi,audio/x-midi"></label>
  <p id="fname" class="fname">未選択</p>
  <p id="hsInfo" class="fname" hidden></p>
  <details id="libBox"><summary>保存した曲 <span id="libN"></span></summary><div id="lib"></div></details>
  <label class="file sub" id="sfRow" hidden>SoundFontを選択<input id="sf" type="file" accept=".sf2,.sf3"></label>
  <div class="opts">
    <label>難易度
      <select id="diff"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option><option value="hard">HARD</option><option value="lunatic">LUNATIC、狂気的ー</option><option value="custom">CUSTOM（自分で設定）</option></select>
    </label>
    <label>レーン数
      <select id="lanes"><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
    </label>
    <label>ノーツ速度 <b id="speedV"></b>
      <input id="speed" type="range" min="0.8" max="5" step="0.1">
    </label>
    <label>曲の音量 <b id="volV"></b>
      <input id="vol" type="range" min="0" max="100" step="5">
    </label>
    <label>タップ音<b id="sfxV"></b>
      <input id="sfx" type="range" min="0" max="100" step="5">
    </label>
    <label class="chk"><input id="lite" type="checkbox"> 軽量モード</label>
    <label class="chk"><input id="auto" type="checkbox"> オートプレイ</label>
    <label class="chk"><input id="blines" type="checkbox"> 小節線・拍線を表示</label>
    <label class="chk"><input id="fson" type="checkbox"> FAST/SLOW表示</label>
    <label class="chk"><input id="autoadj" type="checkbox"> ズレの自動調整（プレイ後）</label>
    <label>判定オフセット <b id="offsetV"></b>
      <input id="offset" type="range" min="-300" max="300" step="10">
    </label>
  </div>
  <div id="cust" class="cust" hidden><div><b>カスタム難易度</b> <span class="pn">プリセットから読み込み:</span></div><div class="pre" id="custPre"></div><div id="custBody" class="opts"></div></div>
  <details id="keyBox"><summary>キー設定（PC）</summary><p class="status">ボタンを押してから割り当てたいキーを押すと変更できます。奇数レーンは中央を Space にしています。</p><div id="keycfg" class="keycfg"></div></details>
  <button id="start" disabled>開始</button>
  <button id="edOpen" class="sub">譜面を編集</button>
  <p id="status" class="status">音源を読み込みしてるふり</p>
</main>

<section id="result" hidden>
  <p class="rlabel" id="rLabel">SCORE</p>
  <p id="rScore" class="rscore"></p>
  <p id="rDetail" class="rdetail"></p>
  <p id="rExtra" class="rdetail"></p>
  <button id="rAdj" class="sub" hidden></button>
  <button id="again">メニューに戻る</button>
</section>

<section id="pause" hidden>
  <p class="rscore">一時停止</p>
  <button id="resume">再開</button>
  <button id="retry" class="sub">やり直しー</button>
  <button id="quit" class="sub">シュウリョウ</button>
  <p id="pauseMsg" class="status"></p>
</section>


<section id="editor" hidden>
  <h1>譜面エディタ</h1>
  <p id="edTitle" class="fname">未選択</p>
  <p id="edSelTop" class="status">未選択：ノーツをタップして選択してください</p>
  <div class="edbar" id="edTools">
    <button data-tool="select" class="on">選択・移動</button>
    <button data-tool="tap">タップ追加</button>
    <button data-tool="long">ロング追加</button>
    <button data-tool="flick">フリック追加</button>
    <button data-tool="bar">バー追加</button>
    <button data-tool="delete">削除</button>
  </div>
  <div class="edbar">
    <label>スナップ <select id="edSnap"><option value="0">なし</option><option value="1">1拍</option><option value="2">1/2拍</option><option value="4" selected>1/4拍</option></select></label>
    <label>拡大 <select id="edZoom"><option value="60">60px/秒</option><option value="100" selected>100px/秒</option><option value="160">160px/秒</option></select></label>
    <button id="edUndo" class="sub">元に戻す</button>
    <button id="edRedo" class="sub">やり直し</button>
    <button id="edReset" class="sub">自動生成に戻す</button>
  </div>
  <div class="edbar">
    <button id="edPrev" class="sub">◀ 前のノーツ</button>
    <button id="edNext" class="sub">次のノーツ ▶</button>
    <input id="edTimeSlider" type="range" min="0" max="60" step="0.1" value="0">
  </div>
  <div id="edScroll"><canvas id="edcv"></canvas></div>
  <p id="edInfo" class="status"></p>
  <div id="edSel" class="opts">
    <div class="row"><span id="edKind"></span></div>
    <p id="edDetail" class="status">未選択：ノーツをタップして選択してください</p>
    <div class="row">
      <label>時刻 <input id="edTime" type="number" step="0.01" min="0" style="width:90px"> 秒</label>
      <label>レーン <select id="edLane"></select></label>
      <label>終端 <input id="edEnd" type="number" step="0.05" min="0" style="width:90px"> 秒</label>
    </div>
    <div class="row">
      <button id="edFlick" class="sub">フリック：オフ</button>
      <button id="edLenM" class="sub">長さ -0.25</button>
      <button id="edLenP" class="sub">長さ +0.25</button>
      <button id="edDup" class="sub">複製</button>
      <button id="edDel" class="sub">削除</button>
    </div>
    <p class="status">ドラッグで移動。Deleteで削除。Ctrl+Zで元に戻す。矢印キーで移動。ロール / トリル / なぞりは新規作成できません（移動・削除のみ）。</p>
  </div>
  <div class="edbar">
    <button id="edSave">保存</button>
    <button id="edExport" class="sub">JSON書き出し</button>
    <button id="edImportBtn" class="sub">JSON読み込み</button>
    <label class="status"><input id="edAuto" type="checkbox"> オートで遊ぶ</label>
    <button id="edPlay">この譜面で遊ぶ</button>
    <button id="edClose" class="sub">閉じる</button>
  </div>
  <input id="edImport" type="file" accept=".json,application/json" hidden>
</section>

<button id="pbtn" hidden aria-label="一時停止" title="一時停止"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
<button id="fs" aria-label="全画面" title="全画面"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<div id="toast" hidden></div>
