<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PCサバイバル - プロトタイプ</title>
<style>
  :root { color-scheme: dark; --bg:#10151f; --panel:#1a2432; --line:#35465b; --text:#edf4ff; --muted:#a9bbd0; --accent:#7dd3fc; --green:#86efac; --red:#fca5a5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif; overscroll-behavior:none; }
  button { font:inherit; color:var(--text); border:1px solid #496078; border-radius:12px; background:#26374b; padding:12px 10px; min-height:46px; touch-action:manipulation; }
  button:active { transform:scale(.98); background:#34506b; }
  button:disabled { opacity:.4; }
  .app { max-width:900px; margin:0 auto; padding:12px; padding-bottom:calc(14px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  h1 { font-size:18px; margin:0; }
  .sub { color:var(--muted); font-size:12px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:10px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; min-width:0; }
  .stat span { display:block; font-size:11px; color:var(--muted); }
  .stat strong { font-size:15px; display:block; margin-top:3px; white-space:nowrap; }
  .bar { height:5px; border-radius:9px; background:#344254; margin-top:6px; overflow:hidden; }
  .fill { height:100%; width:0%; background:var(--accent); transition:width .15s; }
  #arena { width:100%; height:min(48vh,420px); min-height:270px; display:block; background:#111d2b; border:1px solid var(--line); border-radius:14px; touch-action:manipulation; }
  .status { margin:9px 0; min-height:38px; padding:10px 12px; border-radius:10px; background:#172333; border:1px solid var(--line); font-size:13px; }
  .controls { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .controls button strong { display:block; font-size:14px; }
  .controls button small { display:block; font-size:11px; color:#c0d0e1; margin-top:3px; }
  .primary { background:#155e75; border-color:#38bdf8; }
  .secondary { background:#21442f; border-color:#4ade80; }
  .footer { color:var(--muted); font-size:11px; line-height:1.5; margin-top:10px; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; background:#07101bd9; z-index:5; }
  #overlay.hidden { display:none; }
  .dialog { width:min(440px,100%); background:#1b2939; border:1px solid #52677e; border-radius:18px; padding:20px; box-shadow:0 18px 70px #0008; }
  .dialog h2 { margin:0 0 8px; font-size:22px; }
  .dialog p { color:#c4d2e2; line-height:1.6; font-size:14px; }
  .dialog button { width:100%; margin-top:8px; }
  @media (max-width:480px) { .app {padding:9px;} .stats {gap:5px;} .stat {padding:7px 6px;} .stat strong {font-size:13px;} #arena {height:40vh; min-height:250px;} .controls button {padding:10px 7px;} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>PCサバイバル <span class="sub">/ 試作 v0.1</span></h1><div class="sub">タッチ操作・ブラウザ版</div></div>
    <button id="resetBtn" style="min-height:40px;padding:7px 10px">最初から</button>
  </header>
  <section class="stats">
    <div class="stat"><span>explorer.exe HP</span><strong id="hpText">100 / 100</strong><div class="bar"><div id="hpBar" class="fill" style="background:#f87171;width:100%"></div></div></div>
    <div class="stat"><span>CPU使用率</span><strong id="cpuText">0%</strong><div class="bar"><div id="cpuBar" class="fill" style="background:#fbbf24;width:0%"></div></div></div>
    <div class="stat"><span>RAM</span><strong id="ramText">0 / 4 GB</strong><div class="bar"><div id="ramBar" class="fill" style="width:0%"></div></div></div>
    <div class="stat"><span>ストレージ</span><strong id="diskText">0 / 64 GB</strong><div class="bar"><div id="diskBar" class="fill" style="background:#c084fc;width:0%"></div></div></div>
  </section>
  <canvas id="arena" aria-label="戦闘画面"></canvas>
  <div class="status" id="status">「戦闘開始」を押してください。敵を全滅させるとステージクリアです。</div>
  <div class="controls">
    <button id="startBtn" class="primary"><strong>戦闘開始</strong><small>敵が出現します</small></button>
    <button id="cmdBtn" class="secondary"><strong>cmd.exe：四角を落とす</strong><small>CPU +30% / RAM 1GB / 敵に20ダメージ</small></button>
    <button id="paintBtn"><strong>paint.exe：レーザー</strong><small>CPU +15% / RAM 1.5GB / 敵に攻撃</small></button>
    <button id="coolBtn"><strong>CPUを休ませる</strong><small>アプリ攻撃を止めて負荷を下げる</small></button>
  </div>
  <div class="footer">試作ルール：敵は画面上部から下へ進みます。敵が下端に到達するとHPが10減ります。攻撃で敵を倒すとゴミデータが増え、ストレージを使います。今は基本戦闘ループの確認用です。</div>
</div>
<div id="overlay">
  <div class="dialog">
    <h2 id="dialogTitle">PCサバイバル</h2>
    <p id="dialogText">アプリを使って敵を倒し、PCの負荷と容量を管理しましょう。敵をすべて倒すとクリアです。iPadのタッチ操作に対応しています。</p>
    <button id="dialogBtn" class="primary">プロトタイプを開始</button>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('arena'), ctx = canvas.getContext('2d');
  let W=800,H=420,dpr=1, raf=0,last=0, spawnTimer=0, enemyId=0;
  let state='ready', hp=100,cpu=0,ram=0,disk=0, kills=0, totalSpawned=0, enemies=[], shots=[], effects=[], squares=[];
  const RAM_MAX=4, DISK_MAX=64;
  function resize(){
    const r=canvas.getBoundingClientRect(); dpr=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(300,r.width); H=Math.max(250,r.height);
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); draw();
  }
  window.addEventListener('resize',resize);
  function say(t){$('status').textContent=t;}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function updateUI(){
    $('hpText').textContent=`${Math.max(0,Math.ceil(hp))} / 100`;
    $('hpBar').style.width=clamp(hp,0,100)+'%';
    $('cpuText').textContent=Math.round(cpu)+'%'; $('cpuBar').style.width=clamp(cpu,0,100)+'%';
    $('ramText').textContent=`${ram.toFixed(1)} / ${RAM_MAX} GB`; $('ramBar').style.width=clamp(ram/RAM_MAX*100,0,100)+'%';
    $('diskText').textContent=`${disk.toFixed(1)} / ${DISK_MAX} GB`; $('diskBar').style.width=clamp(disk/DISK_MAX*100,0,100)+'%';
    $('startBtn').disabled=state==='playing';
    $('cmdBtn').disabled=state!=='playing' || ram+1>RAM_MAX || cpu>=100;
    $('paintBtn').disabled=state!=='playing' || ram+1.5>RAM_MAX || cpu>=100;
    $('coolBtn').disabled=state!=='playing';
  }
  function addEffect(x,y,text,color='#fff'){effects.push({x,y,text,color,t:0.8});}
  function spawnEnemy(){
    if(state!=='playing')return;
    const x=40+Math.random()*(W-80);
    enemies.push({id:++enemyId,x,y:20,hp:30,maxHp:30,speed:18+Math.random()*12,attackTimer:2.2+Math.random()*1.5,size:28});
    totalSpawned++;
  }
  function hitEnemy(e,damage){
    e.hp-=damage; addEffect(e.x,e.y-8,`-${damage}`,'#fde68a');
    if(e.hp<=0){
      enemies=enemies.filter(x=>x!==e); kills++;
      if(disk<DISK_MAX){disk=Math.min(DISK_MAX,disk+1);addEffect(e.x,e.y,'+Temp.dat','#86efac');}
      say(`敵を撃破！ ゴミデータ +1GB（撃破数 ${kills}）`);
      if(kills>=5 && enemies.length===0) win();
    }
  }
  function useCmd(){
    if(state!=='playing')return;
    if(ram+1>RAM_MAX){say('RAM不足！ CPUを休ませるか、別の攻撃を使ってください。');return;}
    if(cpu>=100){say('CPUが限界です。少し休ませてください。');return;}
    ram=Math.min(RAM_MAX,ram+1); cpu=Math.min(100,cpu+30);
    const target=enemies.length?enemies[0]:null;
    if(target){hitEnemy(target,20);addEffect(target.x,target.y+22,'cmd.exe','#86efac');}
    else {addEffect(W/2,H/2,'四角を生成','#86efac');}
    squares.push({x:target?target.x:W/2,y:target?target.y+15:H*.55,t:.6});
    if(ram>=RAM_MAX)say('RAMが満杯です。現在の試作では、RAMは戦闘中に自動回復しません。');
    updateUI(); draw();
  }
  function usePaint(){
    if(state!=='playing')return;
    if(ram+1.5>RAM_MAX){say('RAM不足！ paint.exeを起動できません。');return;}
    if(cpu>=100){say('CPUが限界です。少し休ませてください。');return;}
    ram=Math.min(RAM_MAX,ram+1.5);cpu=Math.min(100,cpu+15);
    // Touch-friendly attack: damage the lowest enemy; if none, show a laser sweep.
    if(enemies.length){
      const target=enemies.reduce((a,b)=>a.y>b.y?a:b);
      hitEnemy(target,15);
      effects.push({x:target.x,y:target.y-18,beam:true,t:.22});
      say('paint.exeで攻撃！');
    } else {effects.push({x:W*.15,y:H*.7,beam:true,t:.22});say('paint.exeを使用しました。敵が出現するまで待機してください。');}
    updateUI();draw();
  }
  function cool(){
    if(state!=='playing')return;
    cpu=Math.max(0,cpu-25);ram=Math.max(0,ram-1);
    say('休止中：CPU負荷とRAM使用量が下がりました。');
    updateUI();
  }
  function start(){
    if(state==='playing')return;
    if(state==='won'||state==='lost')reset(false);
    state='playing';hp=100;cpu=0;ram=0;disk=0;kills=0;totalSpawned=0;enemies=[];shots=[];effects=[];squares=[];
    spawnTimer=0.2;last=performance.now();say('戦闘中：敵を5体倒しましょう。');
    $('overlay').classList.add('hidden');updateUI();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  }
  function win(){
    if(state!=='playing')return;state='won';say('ステージクリア！ 敵をすべて倒しました。');
    $('dialogTitle').textContent='ステージクリア';$('dialogText').textContent=`敵を${kills}体倒しました。これは基本戦闘ループの試作です。次はフォルダ選択やショップを追加できます。`;$('dialogBtn').textContent='もう一度プレイ';$('overlay').classList.remove('hidden');updateUI();
  }
  function lose(){
    if(state!=='playing')return;state='lost';say('ブルースクリーン：explorer.exe のHPが0になりました。');
    $('dialogTitle').textContent='ブルースクリーン';$('dialogText').textContent=`今回のランは終了です。撃破数：${kills}。もう一度プレイして操作を試せます。`;$('dialogBtn').textContent='再挑戦';$('overlay').classList.remove('hidden');updateUI();
  }
  function reset(show=true){
    cancelAnimationFrame(raf);state='ready';hp=100;cpu=0;ram=0;disk=0;kills=0;totalSpawned=0;enemies=[];shots=[];effects=[];squares=[];spawnTimer=0;
    $('dialogTitle').textContent='PCサバイバル';$('dialogText').textContent='アプリを使って敵を倒し、PCの負荷と容量を管理しましょう。敵を5体倒すとクリアです。iPadのタッチ操作に対応しています。';$('dialogBtn').textContent='プロトタイプを開始';
    if(show)$('overlay').classList.remove('hidden');say('「戦闘開始」を押してください。敵を全滅させるとステージクリアです。');updateUI();draw();
  }
  function loop(now){
    if(state!=='playing')return;
    const dt=Math.min((now-last)/1000,.05);last=now;
    cpu=Math.max(0,cpu-7*dt);
    if(cpu>=100){cpu=100;addEffect(W/2,H/2,'CPU LIMIT','#fca5a5');}
    spawnTimer-=dt;
    if(spawnTimer<=0 && kills<5 && enemies.length<5){spawnEnemy();spawnTimer=1.25;}
    for(const e of [...enemies]){
      e.y+=e.speed*dt*(cpu>=71?.7:1);
      e.attackTimer-=dt;
      if(e.y>H-48){
        hp-=10;addEffect(e.x,H-45,'-10 HP','#fca5a5');enemies=enemies.filter(x=>x!==e);
        say('敵が下端に到達！ HP -10');
        if(hp<=0){hp=0;lose();return;}
      }
    }
    for(const s of squares)s.t-=dt;
    squares=squares.filter(s=>s.t>0);
    for(const e of effects)e.t-=dt;effects=effects.filter(e=>e.t>0);
    if(kills>=5 && enemies.length===0){win();return;}
    updateUI();draw();raf=requestAnimationFrame(loop);
  }
  function draw(){
    if(!ctx)return;
    ctx.clearRect(0,0,W,H);
    // Desktop-style background
    ctx.fillStyle='#111d2b';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#1f3044';ctx.lineWidth=1;
    for(let x=0;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.fillStyle='#a8bdd2';ctx.font='12px system-ui';ctx.fillText('C:\\\\Users\\\\Desktop',12,20);
    // Bottom player bar
    ctx.fillStyle='#20374b';ctx.fillRect(0,H-32,W,32);
    ctx.fillStyle='#67e8f9';ctx.fillRect(W/2-32,H-28,64,22);
    ctx.fillStyle='#0b2635';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('explorer.exe',W/2,H-13);ctx.textAlign='left';
    // Enemies
    for(const e of enemies){
      ctx.fillStyle='#5a2e3b';ctx.strokeStyle='#fb7185';ctx.lineWidth=1.5;
      ctx.fillRect(e.x-e.size/2,e.y-e.size/2,e.size,e.size);ctx.strokeRect(e.x-e.size/2,e.y-e.size/2,e.size,e.size);
      ctx.fillStyle='#ffe4e6';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('AD',e.x,e.y+4);ctx.textAlign='left';
      ctx.fillStyle='#3f1d29';ctx.fillRect(e.x-17,e.y-22,34,4);ctx.fillStyle='#f87171';ctx.fillRect(e.x-17,e.y-22,34*clamp(e.hp/e.maxHp,0,1),4);
    }
    for(const s of squares){ctx.globalAlpha=clamp(s.t/.6,0,1);ctx.fillStyle='#4ade80';ctx.fillRect(s.x-12,s.y-12,24,24);ctx.globalAlpha=1;}
    for(const e of effects){
      ctx.globalAlpha=clamp(e.t/.8,0,1);
      if(e.beam){ctx.strokeStyle='#e0f2fe';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.12,H*.72);ctx.lineTo(W*.88,H*.35);ctx.stroke();}
      else {ctx.fillStyle=e.color;ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(e.text,e.x,e.y-20*(1-e.t/.8));ctx.textAlign='left';}
      ctx.globalAlpha=1;
    }
    if(state==='ready'){
      ctx.fillStyle='#c1d0e0';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('戦闘開始を押すと敵が出現',W/2,H/2);ctx.textAlign='left';
    }
    if(state==='playing' && cpu>=71){ctx.fillStyle='#fbbf24';ctx.font='bold 12px system-ui';ctx.fillText('CPU負荷：動作低下',12,40);}
  }
  $('startBtn').addEventListener('click',start);
  $('cmdBtn').addEventListener('click',useCmd);
  $('paintBtn').addEventListener('click',usePaint);
  $('coolBtn').addEventListener('click',cool);
  $('resetBtn').addEventListener('click',()=>reset(true));
  $('dialogBtn').addEventListener('click',start);
  // Tap a visible enemy to target it with a basic 5-damage click attack.
  canvas.addEventListener('pointerdown',e=>{
    if(state!=='playing')return;
    const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    const target=enemies.find(en=>Math.abs(en.x-x)<25&&Math.abs(en.y-y)<25);
    if(target){hitEnemy(target,5);say('敵をタップ！ 5ダメージ');updateUI();draw();}
  });
  resize();updateUI();
})();
</script>
</body>
</html>
